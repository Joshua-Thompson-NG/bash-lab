name: ShellCheck

on:
  push:
    paths:
      - '**.sh'
      - '.github/workflows/shellcheck.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    name: Check changed shell scripts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run ShellCheck on changed scripts
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            # On the first push, check all tracked shell scripts.
            mapfile -d '' -t files < <(git ls-files -z -- ':(glob)**/*.sh')
          else
            mapfile -d '' -t files < <(
              git diff --name-only --diff-filter=ACMRT -z \
                "$BEFORE" "$GITHUB_SHA" -- ':(glob)**/*.sh'
            )
          fi

          if ((${#files[@]} == 0)); then
            echo "No changed shell scripts to check."
            exit 0
          fi

          printf 'Checking: %s\n' "${files[@]}"
          shellcheck "${files[@]}"
